name: Release

# Pushing a tag like v0.2.0 builds everything and publishes a release:
# the Windows and macOS downloads, the Python packages and the container image.
# How to cut one: docs/releasing.md.
#
# The release starts as a draft, each build job puts its own files into it,
# and only when all of them are through does it become visible. Handing the
# files from job to job as artifacts instead failed at the last step, with
# everything built and nothing published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: The tag must be the version in the code
        run: test "v$(python -c 'import troedel; print(troedel.__version__)')" = "$GITHUB_REF_NAME"
      - run: ruff check .
      - run: pytest -q

  draft:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Draft release, unless a run before this one made it
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "Trödel ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag

  python:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv && uv build
      - run: gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --clobber

  windows:
    needs: draft
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      # The installer is compiled with Inno Setup; without it only the ZIP
      # is built, and the check after it fails on purpose.
      - run: choco install innosetup --no-progress -y
      - run: python packaging/build.py windows
      - run: packaging/windows/smoke.ps1
        shell: pwsh
      - run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*-setup.exe --clobber
        shell: bash

  macos:
    needs: draft
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: python packaging/build.py macos
      - run: packaging/macos/smoke.sh
      - run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "list=$image:${GITHUB_REF_NAME#v},$image:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ github.ref_name }}

  publish:
    needs: [python, windows, macos, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Everything is there
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | tee files.txt
          for kind in '\.whl$' '\.tar\.gz$' 'windows-x64\.zip$' 'windows-x64-setup\.exe$' 'macos-arm64\.dmg$'; do
            grep -q -- "$kind" files.txt || { echo "missing: $kind"; exit 1; }
          done
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
