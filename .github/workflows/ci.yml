name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg EXTRAS="" -t troedel:ci .

  # The downloads are built and started on every change, so a release
  # does not find out too late that it no longer starts.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      # The installer is compiled with Inno Setup; without it only the ZIP
      # is built, and the check after it fails on purpose.
      - run: choco install innosetup --no-progress -y
      - run: python packaging/build.py windows
      - run: packaging/windows/smoke.ps1
        shell: pwsh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: python packaging/build.py macos
      - run: packaging/macos/smoke.sh
